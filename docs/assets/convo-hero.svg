<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
<title id="title">Convo — Give every voice a story.</title><desc id="desc">A monochrome conversation studio: develop a cast, shape the dialogue, and bring it to life.</desc>
<rect width="1280" height="600" rx="24" fill="#101010"/>
<g fill="none" stroke="#303030"><path d="M0 490H1280M890 0V600"/><circle cx="1130" cy="145" r="210"/><circle cx="1130" cy="145" r="170"/><circle cx="1130" cy="145" r="130"/></g>
<g font-family="Inter,Arial,sans-serif">
<text x="68" y="87" fill="#fff" font-size="34" font-weight="700">convo.</text>
<rect x="208" y="62" width="136" height="29" rx="14" fill="#262626"/><text x="225" y="81" fill="#ccc" font-size="12" letter-spacing="2">DESKTOP STUDIO</text>
<text x="66" y="211" fill="#fff" font-size="66" font-weight="700" letter-spacing="-3">Give every voice</text><text x="66" y="288" fill="#fff" font-size="66" font-weight="700" letter-spacing="-3">a story.</text>
<text x="70" y="342" fill="#aaa" font-size="21">Characters with a past. Dialogue with a pulse.</text>
<text x="70" y="377" fill="#aaa" font-size="21">A conversation you can shape, take by take.</text>
<rect x="70" y="417" width="239" height="38" rx="19" fill="#f5f5f5"/><text x="90" y="442" fill="#171717" font-size="14" font-weight="700">RUST × TAURI × ELEVENLABS</text>
<text x="70" y="547" fill="#aaa" font-size="15" letter-spacing="2">DEVELOP THE CAST</text><text x="373" y="547" fill="#aaa" font-size="15" letter-spacing="2">DIRECT THE MOMENT</text><text x="711" y="547" fill="#aaa" font-size="15" letter-spacing="2">KEEP EVERY TAKE</text>
<rect x="842" y="213" width="365" height="90" rx="17" fill="#202020" stroke="#3a3a3a"/><text x="868" y="246" fill="#a3a3a3" font-size="13">MAYA · [hesitates]</text><text x="868" y="275" fill="#fafafa" font-size="18">I was going to tell you...</text>
<rect x="900" y="322" width="307" height="90" rx="17" fill="#f4f4f4"/><text x="926" y="355" fill="#666" font-size="13">LEO · [softly]</text><text x="926" y="384" fill="#171717" font-size="18">Yeah. Take your time.</text>
</g></svg>
