[package]
name = "convo"
version = "0.1.0"
description = "A local-first expressive conversation studio"
edition = "2021"

[lib]
name = "convo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["fs", "rt", "sync", "time"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "wav", "pcm", "flac"] }
mp3lame-encoder = "0.2.5"
futures-util = "0.3"
sha2 = "0.11.0"
tempfile = "3"

# Audio decoding and room simulation process tens of millions of samples even
# in local development builds. Keep this code optimized for interactive playback.
[profile.dev]
opt-level = 2

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
